# ============================================================================
# octopus_fs — packaging & tooling
# ----------------------------------------------------------------------------
# Backend: hatchling (simple, PEP 621 native, builds sdist + wheel with `uv build`)
# Recommended workflow (Mac Apple Silicon, Python 3.11):
#   uv sync --all-extras        # create .venv + install dev deps
#   uv run pytest               # tests
#   uv build                    # dist/octopus_fs-0.1.0-py3-none-any.whl
# ============================================================================

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "octopus_fs"
version = "0.1.0"
description = "One API for eight feature selection techniques — at scale and in discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Pinheiro" }]
keywords = ["feature-selection", "machine-learning", "mlops", "explainability"]

# --- Core deps: keep this list SMALL. Everything heavy goes into extras. -----
# Rationale: a production pipeline should be able to `pip install octopus_fs` and
# get the filter/embedded arms without pulling shap, matplotlib or jinja2.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydantic>=2.6",       # config validation + serializable run manifest
]

[project.optional-dependencies]
# Heavy / optional arms
shap = ["shap>=0.44"]
trees = ["lightgbm>=4.0"]           # optional stronger default estimator
# Discovery / HTML layer
report = ["jinja2>=3.1", "plotly>=5.20"]
# Everything a user might want
all = ["octopus_fs[shap,trees,report]"]
# Contributor toolchain
dev = [
  "octopus_fs[all]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",   # property-based tests for rank aggregation
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
octopus_fs = "octopus_fs.cli:main"

[project.urls]
Homepage = "https://github.com/<you>/octopus_fs"

[tool.hatch.build.targets.wheel]
packages = ["src/octopus_fs"]

# --- Ruff: linter + formatter (replaces black/isort/flake8) ------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "D"]
ignore = ["ANN101", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- Mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true      # shap/lightgbm ship partial stubs

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=octopus_fs --cov-report=term-missing"
markers = [
  "slow: arms that fit models (rfe, shap, permutation)",
  "optional: requires an optional extra to be installed",
]
